<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Skindex</title>
  <link rel="icon" href="/logo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    /* Colors and sizes in one place, so they're easy to change. */
    :root {
      --bg: #050607;
      --surface: #101214;
      --surface-hover: #15181b;
      --thumb-glow: #22272b;
      --line: #1d2124;
      --text: #f3f5f6;
      --muted: #8a9096;
      --up: #3ddc97;
      --down: #ff6159;
      --radius: 14px;
      color-scheme: dark;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    .page {
      max-width: 760px;
      margin: 0 auto;
      padding: 32px 16px 96px;
    }

    /* Header with logo and name */
    header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 56px;
    }
    header img { width: 36px; height: 36px; }
    .brand { font-size: 22px; font-weight: 700; letter-spacing: -0.02em; }

    /* The big number at the top */
    .hero-label { color: var(--muted); font-size: 15px; font-weight: 500; }
    .hero-value {
      font-size: clamp(40px, 9vw, 56px);
      font-weight: 600;
      letter-spacing: -0.03em;
      margin: 8px 0 6px;
      font-variant-numeric: tabular-nums;
    }
    .hero-change { font-size: 16px; font-weight: 500; font-variant-numeric: tabular-nums; }
    .hero-meta { color: var(--muted); font-size: 14px; margin-top: 16px; }

    /* "Prices updated ... · Next update in ..." with a colored dot in front */
    .status {
      display: flex;
      align-items: baseline;
      gap: 8px;
      color: var(--muted);
      font-size: 14px;
      margin-top: 6px;
      line-height: 1.5;
    }
    .status .dot {
      flex-shrink: 0;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--up);
      transform: translateY(-1px);
    }
    .status.updating .dot { animation: pulse 1.2s ease-in-out infinite; }
    .status.error .dot { background: var(--down); }
    .status.error { color: var(--text); }
    @keyframes pulse { 50% { opacity: 0.25; } }
    @media (prefers-reduced-motion: reduce) {
      .status.updating .dot { animation: none; }
    }

    /* Search box and sort buttons */
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin: 56px 0 8px;
    }
    .search {
      flex: 1 1 240px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--text);
      font: inherit;
      font-size: 15px;
      padding: 12px 18px;
      outline: none;
    }
    .search::placeholder { color: var(--muted); }
    .search:focus { border-color: var(--up); }

    .sort {
      display: flex;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 4px;
    }
    .sort button {
      background: none;
      border: 0;
      border-radius: 999px;
      color: var(--muted);
      cursor: pointer;
      font: inherit;
      font-size: 14px;
      font-weight: 600;
      padding: 8px 14px;
      white-space: nowrap;
    }
    .sort button:hover { color: var(--text); }
    .sort button[aria-pressed="true"] { background: var(--up); color: #04150d; }
    .sort button:focus-visible, .search:focus-visible, .row:focus-visible {
      outline: 2px solid var(--up);
      outline-offset: 2px;
    }

    .count { color: var(--muted); font-size: 13px; margin: 20px 0 8px; }

    /* The list of skins */
    .list { list-style: none; margin: 0; padding: 0; }
    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 22px 12px;
      margin: 0 -12px;
      border-radius: var(--radius);
      color: inherit;
      text-decoration: none;
    }
    .list li + li { border-top: 1px solid var(--line); }
    .row:hover { background: var(--surface-hover); }

    .left {
      display: flex;
      align-items: center;
      gap: 16px;
      min-width: 0;
    }

    /* The small oval picture. If a skin has no picture, its first letter
       is shown in the oval instead. */
    .thumb {
      position: relative;
      flex-shrink: 0;
      display: grid;
      place-items: center;
      width: 64px;
      height: 44px;
      border-radius: 50%;
      overflow: hidden;
      background: radial-gradient(ellipse at center, var(--thumb-glow), var(--surface) 72%);
      border: 1px solid var(--line);
      color: var(--muted);
      font-size: 15px;
      font-weight: 600;
    }
    .thumb img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scale(1.3); /* Steam's pictures have empty space around the rifle */
    }
    @media (max-width: 480px) {
      .left { gap: 12px; }
      .thumb { width: 52px; height: 36px; }
    }

    .name { min-width: 0; }
    .skin {
      font-size: 17px;
      font-weight: 600;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .sub {
      color: var(--muted);
      font-size: 13px;
      margin-top: 4px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .numbers { text-align: right; flex-shrink: 0; }
    .price {
      font-size: 24px;
      font-weight: 600;
      letter-spacing: -0.02em;
      font-variant-numeric: tabular-nums;
    }
    .change {
      font-size: 14px;
      font-weight: 500;
      margin-top: 4px;
      font-variant-numeric: tabular-nums;
    }

    .up { color: var(--up); }
    .down { color: var(--down); }
    .flat { color: var(--muted); }

    .message {
      color: var(--muted);
      text-align: center;
      padding: 64px 16px;
      line-height: 1.6;
    }
    .message code {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 6px;
      color: var(--text);
      padding: 2px 6px;
    }
  </style>
</head>
<body>
  <main class="page">
    <header>
      <img src="/logo.svg" alt="">
      <span class="brand">Skindex</span>
    </header>

    <section aria-live="polite">
      <div class="hero-label">AK-47 Field-Tested index</div>
      <div class="hero-value" id="total">—</div>
      <div class="hero-change" id="total-change"></div>
      <div class="hero-meta" id="meta">Loading prices…</div>
      <div class="status" id="status" hidden>
        <span class="dot"></span>
        <span id="status-text"></span>
      </div>
    </section>

    <div class="controls">
      <input class="search" id="search" type="search" placeholder="Search skins" aria-label="Search skins" autocomplete="off">
      <div class="sort" role="group" aria-label="Sort by">
        <button type="button" data-sort="name" aria-pressed="true">Name</button>
        <button type="button" data-sort="price" aria-pressed="false">Price</button>
        <button type="button" data-sort="change" aria-pressed="false">Biggest change</button>
      </div>
    </div>

    <div class="count" id="count"></div>
    <ul class="list" id="list"></ul>
  </main>

  <script>
    // What the page is currently showing.
    let skins = [];
    let updater = null; // the server's timer: { updating, nextUpdateAt, lastError }
    let query = "";
    let sortBy = "name";

    // How often the page asks the server for fresh data: 1 minute.
    const REFRESH_EVERY_MS = 60 * 1000;

    const money = new Intl.NumberFormat("en-US", { style: "currency", currency: "USD" });

    // Turn cents into "$12.34".
    function formatMoney(cents) {
      return money.format(cents / 100);
    }

    // Turn a change into "+$1.20 (+3.45%)", and pick a color class for it.
    function formatChange(cents, percent) {
      const sign = cents > 0 ? "+" : cents < 0 ? "−" : "";
      const text = `${sign}${formatMoney(Math.abs(cents))} (${sign}${Math.abs(percent).toFixed(2)}%)`;
      const color = cents > 0 ? "up" : cents < 0 ? "down" : "flat";
      return { text, color };
    }

    // SQLite saves times like "2026-10-15 02:14:17" in UTC. Show them in your local time.
    function parseSqliteTime(sqliteTime) {
      return new Date(sqliteTime.replace(" ", "T") + "Z");
    }
    function formatTime(sqliteTime) {
      return parseSqliteTime(sqliteTime).toLocaleString(undefined, { dateStyle: "medium", timeStyle: "short" });
    }

    // "just now", "3 min ago", "2 hr ago", "4 days ago"
    function timeAgo(date) {
      const minutes = Math.floor((Date.now() - date.getTime()) / 60000);
      if (minutes < 1) return "just now";
      if (minutes < 60) return `${minutes} min ago`;
      const hours = Math.floor(minutes / 60);
      if (hours < 24) return `${hours} hr ago`;
      const days = Math.floor(hours / 24);
      return days === 1 ? "1 day ago" : `${days} days ago`;
    }

    // "in 7 min", or "in less than a minute"
    function timeUntil(date) {
      const minutes = Math.ceil((date.getTime() - Date.now()) / 60000);
      return minutes <= 1 ? "in less than a minute" : `in ${minutes} min`;
    }

    // Split "AK-47 | Redline (Field-Tested)" into its parts.
    function splitName(fullName) {
      const match = fullName.match(/^(.+?) \| (.+) \((.+)\)$/);
      return match ? { weapon: match[1], skin: match[2], wear: match[3] } : { weapon: "", skin: fullName, wear: "" };
    }

    // Make text safe to put into HTML (so a name can't break the page).
    function escapeHtml(text) {
      return text.replace(/[&<>"']/g, (ch) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[ch]);
    }

    // The picture for the oval. If there's no picture, or it fails to load,
    // show the skin's first letter instead.
    function thumbnail(image, skinName) {
      const letter = escapeHtml(skinName.charAt(0));
      if (!image) return letter;
      return `<img src="${image}" alt="" loading="lazy" data-letter="${letter}" onerror="this.replaceWith(this.dataset.letter)">`;
    }

    function sortSkins(list) {
      const byName = (a, b) => a.name.localeCompare(b.name);
      if (sortBy === "price") return list.sort((a, b) => b.latestCents - a.latestCents || byName(a, b));
      if (sortBy === "change") return list.sort((a, b) => Math.abs(b.changePercent) - Math.abs(a.changePercent) || byName(a, b));
      return list.sort(byName);
    }

    function renderSummary() {
      if (skins.length === 0) return;
      const latest = skins.reduce((sum, s) => sum + s.latestCents, 0);
      const first = skins.reduce((sum, s) => sum + s.firstCents, 0);
      const change = formatChange(latest - first, ((latest - first) / first) * 100);
      const firstCheck = skins.reduce((min, s) => (s.firstCheckedAt < min ? s.firstCheckedAt : min), skins[0].firstCheckedAt);

      document.getElementById("total").textContent = formatMoney(latest);
      const changeEl = document.getElementById("total-change");
      changeEl.textContent = `${change.text} since ${formatTime(firstCheck)}`;
      changeEl.className = `hero-change ${change.color}`;
      document.getElementById("meta").textContent = `Cost of one of each of ${skins.length} skins`;
    }

    // The line under the summary: when prices were last updated, and what
    // the server's timer is doing. `offline` means the last refresh failed.
    function renderStatus(offline) {
      const parts = [];
      let state = "";

      if (skins.length > 0) {
        const lastCheck = skins.reduce((max, s) => (s.lastCheckedAt > max ? s.lastCheckedAt : max), skins[0].lastCheckedAt);
        parts.push(`Prices updated ${formatTime(lastCheck)} (${timeAgo(parseSqliteTime(lastCheck))})`);
      }

      if (offline) {
        state = "error";
        parts.push("Can't reach the Skindex server, retrying every minute");
      } else if (updater?.updating) {
        state = "updating";
        parts.push("Updating now…");
      } else if (updater?.lastError) {
        state = "error";
        parts.push(`Last update failed (${updater.lastError}), will retry ${updater.nextUpdateAt ? timeUntil(new Date(updater.nextUpdateAt)) : "soon"}`);
      } else if (updater?.nextUpdateAt) {
        parts.push(`Next update ${timeUntil(new Date(updater.nextUpdateAt))}`);
      }

      const status = document.getElementById("status");
      status.hidden = parts.length === 0;
      status.className = `status ${state}`;
      document.getElementById("status-text").textContent = parts.join(" · ");
    }

    function renderList() {
      const list = document.getElementById("list");
      const words = query.toLowerCase().trim();
      const shown = sortSkins(skins.filter((s) => s.name.toLowerCase().includes(words)));

      document.getElementById("count").textContent =
        shown.length === skins.length ? `${skins.length} skins` : `${shown.length} of ${skins.length} skins`;

      if (shown.length === 0) {
        list.innerHTML = `<li class="message">No skins match “${escapeHtml(query)}”.</li>`;
        return;
      }

      list.innerHTML = shown.map((s) => {
        const parts = splitName(s.name);
        const change = formatChange(s.changeCents, s.changePercent);
        const steamUrl = `https://steamcommunity.com/market/listings/730/${encodeURIComponent(s.name)}`;
        const checks = s.checks === 1 ? "1 check" : `${s.checks} checks`;
        return `
          <li>
            <a class="row" href="${steamUrl}" target="_blank" rel="noopener" title="Open on the Steam Community Market">
              <div class="left">
                <div class="thumb" aria-hidden="true">${thumbnail(s.image, parts.skin)}</div>
                <div class="name">
                  <div class="skin">${escapeHtml(parts.skin)}</div>
                  <div class="sub">${escapeHtml([parts.weapon, parts.wear, checks].filter(Boolean).join(" · "))}</div>
                </div>
              </div>
              <div class="numbers">
                <div class="price">${formatMoney(s.latestCents)}</div>
                <div class="change ${change.color}">${change.text}</div>
              </div>
            </a>
          </li>`;
      }).join("");
    }

    // Search: redraw the list every time you type.
    document.getElementById("search").addEventListener("input", (event) => {
      query = event.target.value;
      renderList();
    });

    // Sort buttons: highlight the one you clicked and redraw.
    for (const button of document.querySelectorAll("[data-sort]")) {
      button.addEventListener("click", () => {
        sortBy = button.dataset.sort;
        for (const b of document.querySelectorAll("[data-sort]")) {
          b.setAttribute("aria-pressed", String(b === button));
        }
        renderList();
      });
    }

    // Ask our server for the data, then draw the page.
    async function load() {
      let data;
      try {
        const response = await fetch("/api/skins");
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        data = await response.json();
      } catch (error) {
        if (skins.length > 0) {
          // Keep showing the prices we already have, and say we're offline.
          renderStatus(true);
        } else {
          document.getElementById("meta").textContent = "Couldn't load prices.";
          document.getElementById("list").innerHTML =
            `<li class="message">Couldn't reach the Skindex server. Is <code>npm run web</code> still running?</li>`;
        }
        return;
      }

      skins = data.skins;
      updater = data.updater;

      if (skins.length === 0) {
        document.getElementById("meta").textContent = "No prices yet.";
        document.getElementById("list").innerHTML = updater?.updating
          ? `<li class="message">Fetching the first prices from Steam. This takes about 30 seconds, and the page will fill in by itself.</li>`
          : `<li class="message">No prices saved yet. They'll appear after the server's next update.</li>`;
        renderStatus(false);
        return;
      }

      renderSummary();
      renderStatus(false);
      renderList(); // keeps your search text and sort choice
    }

    // Load now, then again every minute. The server saves new prices every
    // 10 minutes, so the page shows them within a minute of being saved.
    load();
    setInterval(load, REFRESH_EVERY_MS);
  </script>
</body>
</html>
