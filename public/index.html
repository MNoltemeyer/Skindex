<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Skindex</title>
  <link rel="icon" href="/logo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main class="page">
    <header>
      <a class="brand-link" href="/">
        <img src="/logo.svg" alt="">
        <span class="brand">Skindex</span>
      </a>
    </header>

    <section aria-live="polite">
      <h1 class="hero-label">Full AK-47 Collection (Field-Tested)</h1>
      <p class="hero-description">Cost to buy the cheapest Field-Tested listing of every AK-47 skin on the Steam Market.</p>
      <div class="hero-value" id="total">—</div>
      <div class="hero-change" id="total-change"></div>
      <div class="hero-meta" id="meta">Loading prices…</div>
      <div class="status" id="status" hidden>
        <span class="dot"></span>
        <span id="status-text"></span>
      </div>
    </section>

    <div class="controls">
      <input class="search" id="search" type="search" placeholder="Search skins" aria-label="Search skins" autocomplete="off">
      <div class="pills" role="group" aria-label="Sort by">
        <button type="button" data-sort="name">Name<span class="sort-arrow" aria-hidden="true"></span><span class="sr-only"></span></button>
        <button type="button" data-sort="price">Price<span class="sort-arrow" aria-hidden="true"></span><span class="sr-only"></span></button>
        <button type="button" data-sort="change">Change<span class="sort-arrow" aria-hidden="true"></span><span class="sr-only"></span></button>
      </div>
    </div>

    <div class="count" id="count"></div>
    <ul class="list" id="list"></ul>
  </main>

  <!-- Shared helpers (formatMoney, renderStatus, ...) used by the script below -->
  <script src="/common.js"></script>
  <script>
    // What the page is currently showing.
    let skins = [];
    let updater = null; // the server's timer: { updating, nextUpdateAt, lastError }
    let query = "";
    let sortBy = "name";
    let sortDir = "asc"; // "asc" (ascending: smallest first) or "desc" (descending: biggest first)

    // Each sort button: how it compares two skins (smallest first), which
    // direction it starts in when you pick it, and how to describe each direction.
    const SORTS = {
      name: {
        compare: (a, b) => a.name.localeCompare(b.name),
        firstDir: "asc",
        describe: { asc: "A to Z", desc: "Z to A" },
      },
      price: {
        compare: (a, b) => a.latestCents - b.latestCents,
        firstDir: "desc",
        describe: { asc: "lowest price first", desc: "highest price first" },
      },
      // The percentage change since the first check, sign included:
      // +12% sorts above +3%, which sorts above 0%, which sorts above −8%.
      change: {
        compare: (a, b) => a.changePercent - b.changePercent,
        firstDir: "desc",
        describe: { asc: "biggest losers first", desc: "biggest gainers first" },
      },
    };

    function sortSkins(list) {
      const { compare } = SORTS[sortBy];
      const flip = sortDir === "desc" ? -1 : 1;
      // Skins that tie (same price, say) always stay in A to Z order.
      return list.sort((a, b) => flip * compare(a, b) || a.name.localeCompare(b.name));
    }

    // Highlight the selected sort button and show its arrow: ↑ ascending, ↓ descending.
    function renderSortButtons() {
      for (const button of document.querySelectorAll("[data-sort]")) {
        const key = button.dataset.sort;
        const selected = key === sortBy;
        button.setAttribute("aria-pressed", String(selected));
        button.querySelector(".sort-arrow").textContent = selected ? (sortDir === "asc" ? "↑" : "↓") : "";
        // Screen readers can't see the arrow, so they hear the direction in words instead.
        button.querySelector(".sr-only").textContent = selected ? `, ${SORTS[key].describe[sortDir]}` : "";
        button.title = selected
          ? `Sorted ${SORTS[key].describe[sortDir]}. Click to reverse.`
          : `Sort by ${button.firstChild.textContent.toLowerCase()}`;
      }
    }

    function lastCheckedAt() {
      if (skins.length === 0) return null;
      return skins.reduce((max, s) => (s.lastCheckedAt > max ? s.lastCheckedAt : max), skins[0].lastCheckedAt);
    }

    function renderSummary() {
      if (skins.length === 0) return;
      const latest = skins.reduce((sum, s) => sum + s.latestCents, 0);
      const first = skins.reduce((sum, s) => sum + s.firstCents, 0);
      const change = formatChange(latest - first, ((latest - first) / first) * 100);
      const firstCheck = skins.reduce((min, s) => (s.firstCheckedAt < min ? s.firstCheckedAt : min), skins[0].firstCheckedAt);

      document.getElementById("total").textContent = formatMoney(latest);
      const changeEl = document.getElementById("total-change");
      changeEl.textContent = `${change.text} since ${formatTime(firstCheck)}`;
      changeEl.className = `hero-change ${change.color}`;
      // The description above already explains the total, so this line is
      // only used for messages like "Loading prices…".
      document.getElementById("meta").hidden = true;
    }

    function renderList() {
      const list = document.getElementById("list");
      const words = query.toLowerCase().trim();
      const shown = sortSkins(skins.filter((s) => s.name.toLowerCase().includes(words)));

      document.getElementById("count").textContent =
        shown.length === skins.length ? `${skins.length} skins` : `${shown.length} of ${skins.length} skins`;

      if (shown.length === 0) {
        list.innerHTML = `<li class="message">No skins match “${escapeHtml(query)}”.</li>`;
        return;
      }

      list.innerHTML = shown.map((s) => {
        const parts = splitName(s.name);
        const change = formatChange(s.changeCents, s.changePercent);
        const checks = s.checks === 1 ? "1 check" : `${s.checks} checks`;
        return `
          <li>
            <a class="row" href="/skin/${s.id}">
              <div class="left">
                <div class="thumb" aria-hidden="true">${thumbnail(s.image, parts.skin)}</div>
                <div class="name">
                  <div class="skin">${escapeHtml(parts.skin)}</div>
                  <div class="sub">${escapeHtml([parts.weapon, parts.wear, checks].filter(Boolean).join(" · "))}</div>
                </div>
              </div>
              <div class="numbers">
                <div class="price">${formatMoney(s.latestCents)}</div>
                <div class="change ${change.color}">${change.text}</div>
              </div>
            </a>
          </li>`;
      }).join("");
    }

    // Search: redraw the list every time you type.
    document.getElementById("search").addEventListener("input", (event) => {
      query = event.target.value;
      renderList();
    });

    // Sort buttons: clicking the selected one flips the direction; clicking
    // another one selects it, starting in its usual direction.
    for (const button of document.querySelectorAll("[data-sort]")) {
      button.addEventListener("click", () => {
        const key = button.dataset.sort;
        if (key === sortBy) {
          sortDir = sortDir === "asc" ? "desc" : "asc";
        } else {
          sortBy = key;
          sortDir = SORTS[key].firstDir;
        }
        renderSortButtons();
        renderList();
      });
    }
    renderSortButtons();

    // Ask our server for the data, then draw the page.
    async function load() {
      let data;
      try {
        const response = await fetch("/api/skins");
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        data = await response.json();
      } catch (error) {
        if (skins.length > 0) {
          // Keep showing the prices we already have, and say we're offline.
          renderStatus(lastCheckedAt(), updater, true);
        } else {
          document.getElementById("meta").textContent = "Couldn't load prices.";
          document.getElementById("list").innerHTML =
            `<li class="message">Couldn't reach the Skindex server. Is <code>npm run web</code> still running?</li>`;
        }
        return;
      }

      skins = data.skins;
      updater = data.updater;

      if (skins.length === 0) {
        document.getElementById("meta").textContent = "No prices yet.";
        document.getElementById("list").innerHTML = updater?.updating
          ? `<li class="message">Fetching the first prices from Steam. This takes about 30 seconds, and the page will fill in by itself.</li>`
          : `<li class="message">No prices saved yet. They'll appear after the server's next update.</li>`;
        renderStatus(null, updater, false);
        return;
      }

      renderSummary();
      renderStatus(lastCheckedAt(), updater, false);
      renderList(); // keeps your search text and sort choice
    }

    // Load now, then again every minute. The server saves new prices every
    // 10 minutes, so the page shows them within a minute of being saved.
    load();
    setInterval(load, REFRESH_EVERY_MS);
  </script>
</body>
</html>
